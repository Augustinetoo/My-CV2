<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiang Mai and Yangon — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14201C;
    --surface: #1C2B25;
    --surface-2: #24352D;
    --ivory: #F3ECDC;
    --gold: #D4A24C;
    --jade: #8CB093;
    --muted: #9CAA9E;
    --line: rgba(243,236,220,0.12);
    --danger: #D98C6B;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ivory);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  @keyframes reveal{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .reveal{
    opacity: 0;
    animation: reveal 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }
  .reveal-1{ animation-delay: 0.05s; }
  .reveal-2{ animation-delay: 0.15s; }
  .reveal-3{ animation-delay: 0.55s; }
  .reveal-4{ animation-delay: 0.7s; }

  .wrap{
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* ---------- Background globe ---------- */

  .globe-bg{
    position: fixed;
    top: -70px;
    right: -90px;
    width: clamp(320px, 42vw, 480px);
    aspect-ratio: 1 / 1;
    z-index: 0;
    opacity: 0.22;
    pointer-events: none;
  }

  .globe-bg svg{ width: 100%; height: 100%; display: block; }

  .globe-outline{ fill: none; stroke: var(--jade); stroke-width: 1; }

  .globe-lat{ fill: none; stroke: var(--jade); stroke-width: 0.75; }

  .globe-meridian{
    fill: none;
    stroke: var(--gold);
    stroke-width: 0.75;
    transform-box: fill-box;
    transform-origin: center;
    animation: spinMeridian 14s linear infinite;
  }

  @keyframes spinMeridian{
    0%   { transform: scaleX(1); }
    25%  { transform: scaleX(0.02); }
    50%  { transform: scaleX(-1); }
    75%  { transform: scaleX(0.02); }
    100% { transform: scaleX(1); }
  }

  .globe-link{
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.1;
    stroke-dasharray: 3 4;
  }

  .globe-city{ fill: var(--gold); }

  .globe-pulse{
    fill: none;
    stroke: var(--gold);
    stroke-width: 1;
    transform-box: fill-box;
    transform-origin: center;
    animation: pulseRing 3s ease-out infinite;
  }

  @keyframes pulseRing{
    0%{ transform: scale(0.4); opacity: 0.9; }
    100%{ transform: scale(2.6); opacity: 0; }
  }

  /* ---------- Header ---------- */

  header{
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }

  .greeting{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(2rem, 6vw, 2.9rem);
    line-height: 1.05;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .date-line{
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 18px;
  }

  .roofline{
    width: 100%;
    height: 22px;
    display: block;
    opacity: 0.55;
  }

  .roofline polyline{
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: draw 1.4s cubic-bezier(0.3, 0.6, 0.2, 1) 0.3s forwards;
  }

  @keyframes draw{
    to{ stroke-dashoffset: 0; }
  }

  .subtitle{
    font-size: 0.95rem;
    color: var(--jade);
    margin-top: 14px;
  }

  /* ---------- Tabs ---------- */

  nav.tabs{
    display: flex;
    gap: 28px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }

  nav.tabs button{
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1rem;
    font-weight: 500;
    padding: 10px 2px 14px;
    cursor: pointer;
    position: relative;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s ease, border-color 0.25s ease;
  }

  nav.tabs button:hover{ color: var(--ivory); }

  nav.tabs button.active{
    color: var(--ivory);
    border-bottom-color: var(--gold);
  }

  nav.tabs button:focus-visible,
  button:focus-visible,
  select:focus-visible,
  input:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* ---------- Panels ---------- */

  .panel{ display: none; }
  .panel.active{
    display: block;
    animation: reveal 0.4s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
  }

  .city-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 560px){
    .city-grid{ grid-template-columns: 1fr; }
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
  }

  .card h3{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.25rem;
    margin: 0 0 4px;
  }

  .card .tz-note{
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0 0 16px;
  }

  /* ---------- Weather ---------- */

  .wx-current{
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .wx-current svg{ flex-shrink: 0; }

  .wx-temp{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 2.1rem;
    line-height: 1;
  }

  .wx-cond{
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }

  .wx-tomorrow{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .wx-tomorrow-label{
    font-size: 0.85rem;
    color: var(--muted);
  }

  .wx-tomorrow-range{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
  }

  .wx-tomorrow-range .lo{ color: var(--muted); }

  .wx-error, .fx-error{
    color: var(--danger);
    font-size: 0.9rem;
  }

  .icon-spin{
    animation: spin 18s linear infinite;
    transform-origin: 20px 20px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .icon-bob{ animation: bob 3.6s ease-in-out infinite; }
  @keyframes bob{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-3px); }
  }

  .icon-rain g line{ animation: drop 1.1s ease-in infinite; }
  .icon-rain g line:nth-of-type(2){ animation-delay: 0.25s; }
  .icon-rain g line:nth-of-type(3){ animation-delay: 0.5s; }
  @keyframes drop{
    0%{ opacity: 0; transform: translateY(-2px); }
    40%{ opacity: 1; }
    100%{ opacity: 0; transform: translateY(4px); }
  }

  .icon-storm polyline{ animation: flash 2.6s ease-in-out infinite; }
  @keyframes flash{
    0%, 18%, 24%, 100%{ opacity: 1; }
    21%{ opacity: 0.25; }
  }

  /* ---------- Time / clocks ---------- */

  .clock-face{
    display: block;
    margin: 0 auto 16px;
  }

  .digital-time{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.4rem;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ---------- Currency ---------- */

  .fx-converter{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .fx-row{
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  .fx-row input, .fx-row select{
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ivory);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    padding: 10px 12px;
    border-radius: 4px;
  }

  .fx-row input{ flex: 1; min-width: 0; }
  .fx-row select{ flex-shrink: 0; }

  .fx-results{
    display: grid;
    gap: 10px;
  }

  .fx-result{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }

  .fx-result .code{
    color: var(--muted);
    font-size: 0.85rem;
  }

  .fx-result .value{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.15rem;
    display: inline-block;
    animation: pop 0.25s ease;
  }
  @keyframes pop{
    from{ opacity: 0.3; transform: scale(0.97); }
    to{ opacity: 1; transform: scale(1); }
  }

  .fx-rates-note{
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 4px;
  }

  .loading{
    color: var(--muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="globe-bg" aria-hidden="true">
  <svg viewBox="0 0 300 300">
    <circle class="globe-outline" cx="150" cy="150" r="130"/>

    <ellipse class="globe-lat" cx="150" cy="70"  rx="97"  ry="14"/>
    <ellipse class="globe-lat" cx="150" cy="110" rx="119" ry="16"/>
    <ellipse class="globe-lat" cx="150" cy="150" rx="130" ry="20"/>
    <ellipse class="globe-lat" cx="150" cy="190" rx="119" ry="16"/>
    <ellipse class="globe-lat" cx="150" cy="230" rx="97"  ry="14"/>

    <ellipse class="globe-meridian" cx="150" cy="150" rx="130" ry="130" style="animation-delay:-2.33s"/>
    <ellipse class="globe-meridian" cx="150" cy="150" rx="130" ry="130" style="animation-delay:-4.66s"/>
    <ellipse class="globe-meridian" cx="150" cy="150" rx="130" ry="130" style="animation-delay:-7s"/>
    <ellipse class="globe-meridian" cx="150" cy="150" rx="130" ry="130" style="animation-delay:-9.33s"/>
    <ellipse class="globe-meridian" cx="150" cy="150" rx="130" ry="130" style="animation-delay:-11.66s"/>

    <path class="globe-link" d="M118,118 Q106,113 94,133"/>
    <circle class="globe-pulse" cx="118" cy="118" r="3" style="animation-delay:0s"/>
    <circle class="globe-city" cx="118" cy="118" r="2.6"/>
    <circle class="globe-pulse" cx="94" cy="133" r="3" style="animation-delay:1.4s"/>
    <circle class="globe-city" cx="94" cy="133" r="2.6"/>
  </svg>
</div>

<div class="wrap">

  <header>
    <p class="greeting reveal reveal-1" id="greeting">Good afternoon</p>
    <p class="date-line reveal reveal-2" id="dateLine"></p>
    <svg class="roofline" viewBox="0 0 780 22" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="0,20 60,20 90,4 120,20 220,20 250,2 280,20 400,20 430,6 460,20 560,20 590,3 620,20 780,20"
        fill="none" stroke="#D4A24C" stroke-width="1.4"/>
    </svg>
    <p class="subtitle reveal reveal-3">Chiang Mai and Yangon, side by side</p>
  </header>

  <nav class="tabs reveal reveal-4" role="tablist">
    <button class="tab-btn active" data-panel="weather" role="tab" aria-selected="true">Weather</button>
    <button class="tab-btn" data-panel="time" role="tab" aria-selected="false">Time</button>
    <button class="tab-btn" data-panel="currency" role="tab" aria-selected="false">Currency</button>
  </nav>

  <!-- WEATHER PANEL -->
  <section class="panel active" id="panel-weather">
    <div class="city-grid">
      <div class="card">
        <h3>Chiang Mai</h3>
        <p class="tz-note">Thailand</p>
        <div id="wx-CM" class="loading">Fetching weather…</div>
      </div>
      <div class="card">
        <h3>Yangon</h3>
        <p class="tz-note">Myanmar</p>
        <div id="wx-YGN" class="loading">Fetching weather…</div>
      </div>
    </div>
  </section>

  <!-- TIME PANEL -->
  <section class="panel" id="panel-time">
    <div class="city-grid">
      <div class="card">
        <h3>Chiang Mai</h3>
        <p class="tz-note">UTC+7</p>
        <svg class="clock-face" id="clock-CM" viewBox="0 0 140 140" width="140" height="140" aria-hidden="true"></svg>
        <p class="digital-time" id="digital-CM">--:--:--</p>
      </div>
      <div class="card">
        <h3>Yangon</h3>
        <p class="tz-note">UTC+6:30</p>
        <svg class="clock-face" id="clock-YGN" viewBox="0 0 140 140" width="140" height="140" aria-hidden="true"></svg>
        <p class="digital-time" id="digital-YGN">--:--:--</p>
      </div>
    </div>
  </section>

  <!-- CURRENCY PANEL -->
  <section class="panel" id="panel-currency">
    <div class="fx-converter">
      <div class="fx-row">
        <input type="number" id="fxAmount" value="1" min="0" step="any" aria-label="Amount">
        <select id="fxFrom" aria-label="From currency">
          <option value="USD">USD</option>
          <option value="THB">THB</option>
          <option value="MMK">MMK</option>
        </select>
      </div>
      <div class="fx-results" id="fxResults">
        <div class="loading">Fetching exchange rates…</div>
      </div>
      <p class="fx-rates-note" id="fxNote"></p>
    </div>
  </section>

</div>

<script>
  /* ---------------- Tabs ---------------- */
  const tabButtons = document.querySelectorAll('.tab-btn');
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
      btn.classList.add('active'); btn.setAttribute('aria-selected','true');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
    });
  });

  /* ---------------- Greeting + date ---------------- */
  function updateGreeting(){
    const now = new Date();
    const hour = now.getHours();
    let text = 'Good evening';
    if (hour < 5) text = 'Good night';
    else if (hour < 12) text = 'Good morning';
    else if (hour < 17) text = 'Good afternoon';
    document.getElementById('greeting').textContent = text;

    document.getElementById('dateLine').textContent = now.toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }
  updateGreeting();
  setInterval(updateGreeting, 60000);

  /* ---------------- Weather ---------------- */
  const CITIES = {
    CM:  { name: 'Chiang Mai', lat: 18.7883, lon: 98.9853, tz: 'Asia/Bangkok' },
    YGN: { name: 'Yangon',     lat: 16.8409, lon: 96.1735, tz: 'Asia/Yangon' }
  };

  function wmoInfo(code){
    if (code === 0) return { label: 'Clear sky', icon: 'sun' };
    if ([1,2].includes(code)) return { label: 'Partly cloudy', icon: 'cloud-sun' };
    if (code === 3) return { label: 'Overcast', icon: 'cloud' };
    if ([45,48].includes(code)) return { label: 'Fog', icon: 'fog' };
    if ([51,53,55,56,57].includes(code)) return { label: 'Drizzle', icon: 'rain' };
    if ([61,63,65,66,67,80,81,82].includes(code)) return { label: 'Rain', icon: 'rain' };
    if ([71,73,75,77].includes(code)) return { label: 'Snow', icon: 'snow' };
    if ([95,96,99].includes(code)) return { label: 'Thunderstorm', icon: 'storm' };
    return { label: 'Unsettled', icon: 'cloud' };
  }

  function weatherIconSvg(type){
    const stroke = '#D4A24C';
    const jade = '#8CB093';
    const icons = {
      sun: `<circle cx="20" cy="20" r="8" fill="none" stroke="${stroke}" stroke-width="1.6"/>
            <g stroke="${stroke}" stroke-width="1.6">
              <line x1="20" y1="2" x2="20" y2="7"/><line x1="20" y1="33" x2="20" y2="38"/>
              <line x1="2" y1="20" x2="7" y2="20"/><line x1="33" y1="20" x2="38" y2="20"/>
              <line x1="6.9" y1="6.9" x2="10.3" y2="10.3"/><line x1="29.7" y1="29.7" x2="33.1" y2="33.1"/>
              <line x1="33.1" y1="6.9" x2="29.7" y2="10.3"/><line x1="10.3" y1="29.7" x2="6.9" y2="33.1"/>
            </g>`,
      'cloud-sun': `<circle cx="14" cy="15" r="6" fill="none" stroke="${stroke}" stroke-width="1.5"/>
            <path d="M8 30a7 7 0 0 1 1-13.9A9 9 0 0 1 26 19a6 6 0 0 1-1 11H8Z" fill="none" stroke="${jade}" stroke-width="1.6"/>`,
      cloud: `<path d="M9 30a7 7 0 0 1 1-13.9A9 9 0 0 1 27 19a6 6 0 0 1-1 11H9Z" fill="none" stroke="${jade}" stroke-width="1.6"/>`,
      fog: `<path d="M9 22a7 7 0 0 1 1-13.9A9 9 0 0 1 27 11a6 6 0 0 1-1 11H9Z" fill="none" stroke="${jade}" stroke-width="1.4"/>
            <line x1="6" y1="30" x2="34" y2="30" stroke="${stroke}" stroke-width="1.4"/>
            <line x1="10" y1="35" x2="30" y2="35" stroke="${stroke}" stroke-width="1.4"/>`,
      rain: `<path d="M9 20a7 7 0 0 1 1-13.9A9 9 0 0 1 27 9a6 6 0 0 1-1 11H9Z" fill="none" stroke="${jade}" stroke-width="1.6"/>
            <g stroke="${stroke}" stroke-width="1.6" stroke-linecap="round">
              <line x1="13" y1="26" x2="10" y2="34"/><line x1="20" y1="26" x2="17" y2="34"/><line x1="27" y1="26" x2="24" y2="34"/>
            </g>`,
      snow: `<path d="M9 20a7 7 0 0 1 1-13.9A9 9 0 0 1 27 9a6 6 0 0 1-1 11H9Z" fill="none" stroke="${jade}" stroke-width="1.6"/>
            <g stroke="${stroke}" stroke-width="1.6" stroke-linecap="round">
              <line x1="13" y1="27" x2="13" y2="34"/><line x1="9.5" y1="30.5" x2="16.5" y2="30.5"/>
              <line x1="27" y1="27" x2="27" y2="34"/><line x1="23.5" y1="30.5" x2="30.5" y2="30.5"/>
            </g>`,
      storm: `<path d="M9 18a7 7 0 0 1 1-13.9A9 9 0 0 1 27 7a6 6 0 0 1-1 11H9Z" fill="none" stroke="${jade}" stroke-width="1.6"/>
            <polyline points="21,24 16,32 21,32 17,39" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`
    };
    const motionClass = {
      sun: 'icon-spin',
      'cloud-sun': 'icon-bob',
      cloud: 'icon-bob',
      fog: 'icon-bob',
      snow: 'icon-bob',
      rain: 'icon-rain',
      storm: 'icon-storm'
    }[type] || '';

    return `<svg class="${motionClass}" width="40" height="40" viewBox="0 0 40 40">${icons[type] || icons.cloud}</svg>`;
  }

  async function loadWeather(key){
    const city = CITIES[key];
    const el = document.getElementById('wx-' + key);
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}` +
                  `&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode` +
                  `&timezone=${encodeURIComponent(city.tz)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();

      const current = data.current_weather;
      const info = wmoInfo(current.weathercode);

      const tomorrowIdx = 1; // daily[0] is today
      const tHigh = Math.round(data.daily.temperature_2m_max[tomorrowIdx]);
      const tLow = Math.round(data.daily.temperature_2m_min[tomorrowIdx]);
      const tInfo = wmoInfo(data.daily.weathercode[tomorrowIdx]);

      el.innerHTML = `
        <div class="wx-current">
          ${weatherIconSvg(info.icon)}
          <div>
            <div class="wx-temp">${Math.round(current.temperature)}°C</div>
            <div class="wx-cond">${info.label}</div>
          </div>
        </div>
        <div class="wx-tomorrow">
          <span class="wx-tomorrow-label">Tomorrow — ${tInfo.label.toLowerCase()}</span>
          <span class="wx-tomorrow-range"><span class="hi">${tHigh}°</span><span class="lo">${tLow}°</span></span>
        </div>
      `;
    } catch(err){
      el.innerHTML = `<p class="wx-error">Couldn't load weather right now.</p>`;
    }
  }
  loadWeather('CM');
  loadWeather('YGN');

  /* ---------------- Clocks ---------------- */
  function getTimeParts(tz){
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    const parts = fmt.formatToParts(new Date());
    const get = t => parseInt(parts.find(p => p.type === t).value, 10);
    return { h: get('hour'), m: get('minute'), s: get('second') };
  }

  function buildClockFace(svg){
    const ns = 'http://www.w3.org/2000/svg';
    svg.innerHTML = '';
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', 70); circle.setAttribute('cy', 70); circle.setAttribute('r', 64);
    circle.setAttribute('fill', 'none'); circle.setAttribute('stroke', 'rgba(243,236,220,0.25)'); circle.setAttribute('stroke-width', '1.5');
    svg.appendChild(circle);
    for (let i = 0; i < 12; i++){
      const angle = (i * 30) * Math.PI / 180;
      const isMajor = i % 3 === 0;
      const r1 = isMajor ? 54 : 58;
      const x1 = 70 + r1 * Math.sin(angle), y1 = 70 - r1 * Math.cos(angle);
      const x2 = 70 + 64 * Math.sin(angle), y2 = 70 - 64 * Math.cos(angle);
      const tick = document.createElementNS(ns, 'line');
      tick.setAttribute('x1', x1); tick.setAttribute('y1', y1);
      tick.setAttribute('x2', x2); tick.setAttribute('y2', y2);
      tick.setAttribute('stroke', isMajor ? '#D4A24C' : 'rgba(243,236,220,0.3)');
      tick.setAttribute('stroke-width', isMajor ? '2' : '1');
      svg.appendChild(tick);
    }
    const hourHand = document.createElementNS(ns, 'line');
    hourHand.setAttribute('id', svg.id + '-hour');
    hourHand.setAttribute('x1', 70); hourHand.setAttribute('y1', 70);
    hourHand.setAttribute('stroke', '#F3ECDC'); hourHand.setAttribute('stroke-width', '3'); hourHand.setAttribute('stroke-linecap', 'round');
    svg.appendChild(hourHand);

    const minHand = document.createElementNS(ns, 'line');
    minHand.setAttribute('id', svg.id + '-min');
    minHand.setAttribute('x1', 70); minHand.setAttribute('y1', 70);
    minHand.setAttribute('stroke', '#F3ECDC'); minHand.setAttribute('stroke-width', '2'); minHand.setAttribute('stroke-linecap', 'round');
    svg.appendChild(minHand);

    const secHand = document.createElementNS(ns, 'line');
    secHand.setAttribute('id', svg.id + '-sec');
    secHand.setAttribute('x1', 70); secHand.setAttribute('y1', 70);
    secHand.setAttribute('stroke', '#8CB093'); secHand.setAttribute('stroke-width', '1'); secHand.setAttribute('stroke-linecap', 'round');
    svg.appendChild(secHand);

    const hub = document.createElementNS(ns, 'circle');
    hub.setAttribute('cx', 70); hub.setAttribute('cy', 70); hub.setAttribute('r', 3);
    hub.setAttribute('fill', '#D4A24C');
    svg.appendChild(hub);
  }

  function setHand(id, lengthFromCenter, angleDeg){
    const el = document.getElementById(id);
    if (!el) return;
    const rad = angleDeg * Math.PI / 180;
    el.setAttribute('x2', 70 + lengthFromCenter * Math.sin(rad));
    el.setAttribute('y2', 70 - lengthFromCenter * Math.cos(rad));
  }

  function updateClock(key){
    const city = CITIES[key];
    const { h, m, s } = getTimeParts(city.tz);
    const hourAngle = ((h % 12) + m / 60) * 30;
    const minAngle = (m + s / 60) * 6;
    const secAngle = s * 6;

    setHand('clock-' + key + '-hour', 34, hourAngle);
    setHand('clock-' + key + '-min', 48, minAngle);
    setHand('clock-' + key + '-sec', 52, secAngle);

    const pad = n => String(n).padStart(2, '0');
    document.getElementById('digital-' + key).textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  ['CM','YGN'].forEach(key => buildClockFace(document.getElementById('clock-' + key)));
  function tickClocks(){ ['CM','YGN'].forEach(updateClock); }
  tickClocks();
  setInterval(tickClocks, 1000);

  /* ---------------- Currency ---------------- */
  let fxRates = null; // rates relative to USD

  async function loadRates(){
    const resultsEl = document.getElementById('fxResults');
    const noteEl = document.getElementById('fxNote');
    try{
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();
      if (data.result !== 'success') throw new Error('API error');
      fxRates = { USD: 1, THB: data.rates.THB, MMK: data.rates.MMK };
      noteEl.textContent = `Rates last updated ${new Date(data.time_last_update_utc).toLocaleString()}`;
      renderConversion();
    } catch(err){
      resultsEl.innerHTML = `<p class="fx-error">Couldn't load exchange rates right now.</p>`;
      noteEl.textContent = '';
    }
  }

  function renderConversion(){
    if (!fxRates) return;
    const amount = parseFloat(document.getElementById('fxAmount').value) || 0;
    const from = document.getElementById('fxFrom').value;
    const resultsEl = document.getElementById('fxResults');

    const inUsd = amount / fxRates[from];
    const targets = ['USD', 'THB', 'MMK'].filter(c => c !== from);

    resultsEl.innerHTML = targets.map(code => {
      const value = inUsd * fxRates[code];
      const decimals = code === 'MMK' ? 0 : 2;
      return `
        <div class="fx-result">
          <span class="code">${code}</span>
          <span class="value">${value.toLocaleString(undefined, {minimumFractionDigits: decimals, maximumFractionDigits: decimals})}</span>
        </div>`;
    }).join('');
  }

  document.getElementById('fxAmount').addEventListener('input', renderConversion);
  document.getElementById('fxFrom').addEventListener('change', renderConversion);

  loadRates();
</script>

</body>
</html>
